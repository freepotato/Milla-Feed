<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A5CE6"/>
      <stop offset="1" stop-color="#4E42C8"/>
    </linearGradient>
  </defs>

  <!-- 背景（系统会自动裁成圆角松鼠形） -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 报纸 -->
  <rect x="252" y="248" width="520" height="528" rx="36" fill="#FFFFFF"/>

  <!-- 顶部刊头横线 -->
  <rect x="316" y="320" width="392" height="22" rx="11" fill="#C2BDEF"/>
  <rect x="316" y="364" width="244" height="22" rx="11" fill="#D8D4F4"/>

  <!-- M 两侧环绕的文字行（左右各三行，与 M 垂直居中对齐） -->
  <rect x="316" y="476" width="84" height="20" rx="10" fill="#D8D4F4"/>
  <rect x="316" y="524" width="84" height="20" rx="10" fill="#E7E4F9"/>
  <rect x="316" y="572" width="84" height="20" rx="10" fill="#D8D4F4"/>
  <rect x="624" y="476" width="84" height="20" rx="10" fill="#D8D4F4"/>
  <rect x="624" y="524" width="84" height="20" rx="10" fill="#E7E4F9"/>
  <rect x="624" y="572" width="84" height="20" rx="10" fill="#D8D4F4"/>

  <!-- 居中的 M（下方留白，不再有任何横线） -->
  <path d="M428 624 L428 444 L512 548 L596 444 L596 624"
        fill="none" stroke="#5949DB" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>

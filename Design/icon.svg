<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A5CE6"/>
      <stop offset="1" stop-color="#4E42C8"/>
    </linearGradient>
  </defs>

  <!-- 背景（系统会自动裁成圆角松鼠形） -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 报纸 -->
  <rect x="248" y="200" width="528" height="624" rx="36" fill="#FFFFFF"/>

  <!-- 顶部刊头横线 -->
  <rect x="312" y="272" width="400" height="22" rx="11" fill="#C2BDEF"/>
  <rect x="312" y="316" width="262" height="22" rx="11" fill="#D8D4F4"/>

  <!-- M 两侧的短横线（表示文字环绕） -->
  <rect x="312" y="438" width="92" height="20" rx="10" fill="#D8D4F4"/>
  <rect x="312" y="486" width="92" height="20" rx="10" fill="#E7E4F9"/>
  <rect x="620" y="438" width="92" height="20" rx="10" fill="#D8D4F4"/>
  <rect x="620" y="486" width="92" height="20" rx="10" fill="#E7E4F9"/>

  <!-- 居中的 M -->
  <path d="M428 588 L428 380 L512 492 L596 380 L596 588"
        fill="none" stroke="#5949DB" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 底部正文横线 -->
  <rect x="312" y="636" width="400" height="22" rx="11" fill="#C2BDEF"/>
  <rect x="312" y="680" width="400" height="22" rx="11" fill="#D8D4F4"/>
  <rect x="312" y="724" width="400" height="22" rx="11" fill="#D8D4F4"/>
  <rect x="312" y="768" width="250" height="22" rx="11" fill="#E7E4F9"/>
</svg>

# XcodeGen 工程描述文件 —— Milla.xcodeproj 的唯一事实来源。
# 双机协作时只提交本文件，生成的 Milla.xcodeproj 不进 Git（避免 macOS/Windows 冲突）。
# 在 Mac 上执行 `xcodegen generate` 即可生成工程：https://github.com/yonbergman/xcodegen

name: Milla

options:
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "18.0"

packages:
  MillaCore:
    path: Packages/MillaCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    # 发版时由 release-please 自动改写（见 release-please-config.json 的 extra-files），勿手改
    MARKETING_VERSION: "0.1.1" # x-release-please-version
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Xcode 27 已移除传统 headermap，必须显式关闭用户路径搜索
    ALWAYS_SEARCH_USER_PATHS: NO
    # 只编当前架构：否则模拟器会同时编 x86_64+arm64，而 SwiftPM 本地包
    # 只产 arm64 模块，x86_64 一路会报 "built for incompatible target"
    ONLY_ACTIVE_ARCH: YES

targets:
  Milla:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Milla
        excludes:
          - "Resources/Info.plist"
      # 更新日志单一来源：docs/CHANGELOG.md 直接打包进 App，避免两份内容漂移
      - path: docs/CHANGELOG.md
        buildPhase: resources
    resources: []
    info:
      path: Milla/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleDisplayName: Milla
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - package: MillaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.florian.millafeed
        PRODUCT_NAME: Milla
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  MillaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MillaUITests
    dependencies:
      - target: Milla
    settings:
      base:
        PRODUCT_NAME: MillaUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.florian.millafeed.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Milla:
    build:
      targets:
        Milla: all
        MillaUITests: [test]
    test:
      targets:
        - MillaUITests
